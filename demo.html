<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>领取演示账号 - 智慧星 USDT 财务记账系统</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #eef3f8;
        color: #172033;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        width: min(520px, 100%);
        padding: 28px;
        border: 1px solid #d6e1ec;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.12);
      }
      .brand {
        display: flex;
        gap: 14px;
        align-items: center;
        margin-bottom: 22px;
      }
      .mark {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: #117f72;
        color: #fff;
        font-size: 26px;
        font-weight: 900;
      }
      h1, p { margin: 0; }
      h1 { font-size: 24px; line-height: 1.2; }
      .sub { margin-top: 6px; color: #66758a; font-weight: 700; }
      .notice {
        margin: 20px 0;
        padding: 14px;
        border: 1px solid #bfdbfe;
        border-radius: 8px;
        background: #eff6ff;
        color: #1e3a8a;
        line-height: 1.6;
      }
      button {
        width: 100%;
        min-height: 54px;
        border: 0;
        border-radius: 8px;
        background: #117f72;
        color: #fff;
        font-size: 18px;
        font-weight: 900;
        cursor: pointer;
      }
      button:disabled { opacity: 0.62; cursor: wait; }
      .result {
        display: none;
        margin-top: 20px;
        padding: 16px;
        border: 1px solid #bbf7d0;
        border-radius: 8px;
        background: #f0fdf4;
      }
      .result.show { display: grid; gap: 12px; }
      .row span {
        display: block;
        margin-bottom: 4px;
        color: #66758a;
        font-size: 13px;
        font-weight: 800;
      }
      .row strong {
        display: block;
        padding: 10px 12px;
        border: 1px solid #d6e1ec;
        border-radius: 8px;
        background: #fff;
        overflow-wrap: anywhere;
        font-size: 18px;
      }
      .login-link {
        display: block;
        padding: 13px;
        border-radius: 8px;
        background: #117f72;
        color: #fff;
        text-align: center;
        text-decoration: none;
        font-weight: 900;
      }
      .error {
        display: none;
        margin-top: 16px;
        padding: 12px;
        border: 1px solid #fecaca;
        border-radius: 8px;
        background: #fff1f2;
        color: #991b1b;
        font-weight: 800;
      }
      .error.show { display: block; }
      @media (max-width: 520px) {
        body { padding: 14px; align-items: start; }
        .card { padding: 20px; }
        h1 { font-size: 21px; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <div class="mark">¥</div>
        <div>
          <h1>智慧星 USDT 财务记账系统</h1>
          <p class="sub">领取今日可用演示账号</p>
        </div>
      </div>
      <div class="notice">点击后系统会自动分配一个今天未领取、未登录的演示账号。演示数据每天自动重置。</div>
      <button id="claimBtn" type="button">领取演示账号</button>
      <div id="error" class="error"></div>
      <section id="result" class="result" aria-live="polite"></section>
    </main>
    <script>
      const button = document.querySelector("#claimBtn");
      const result = document.querySelector("#result");
      const error = document.querySelector("#error");
      const escapeHtml = (value) => String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;",
      }[char]));
      button.addEventListener("click", async () => {
        button.disabled = true;
        button.textContent = "正在分配...";
        error.classList.remove("show");
        result.classList.remove("show");
        try {
          const response = await fetch("/api/demo/claim", { method: "POST" });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || "领取失败");
          const claim = payload.claim;
          result.innerHTML = `
            <div class="row"><span>演示系统</span><strong>${escapeHtml(claim.tenantName)}</strong></div>
            <div class="row"><span>登录账号</span><strong>${escapeHtml(claim.loginName)}</strong></div>
            <div class="row"><span>登录密码</span><strong>${escapeHtml(claim.password)}</strong></div>
            <p class="sub">${escapeHtml(claim.resetText)}</p>
            <a class="login-link" href="${escapeHtml(payload.loginUrl || "/")}">前往登录</a>
          `;
          result.classList.add("show");
          button.textContent = "已领取";
        } catch (err) {
          error.textContent = err.message || "领取失败";
          error.classList.add("show");
          button.disabled = false;
          button.textContent = "重新领取";
        }
      });
    </script>
  </body>
</html>
